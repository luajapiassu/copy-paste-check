[project]
name = "copy-paste-check"
version = "0.1.0"
description = "Detecção de funções e fórmulas duplicadas para agentes e PRs."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
formula = ["sympy>=1.12"]
dev = ["pytest>=8", "sympy>=1.12"]

[project.scripts]
cpcheck = "copy_paste_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copy_paste_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
